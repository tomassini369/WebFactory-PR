# Experimental branch only. Never deploy this configuration to the original site.
[build]
  command = "node scripts/build-next.mjs"
  publish = "dist-next"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "experimental/empty-functions"
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; frame-src 'self'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cache-Control = "no-store"
[[redirects]]
  from = "/.netlify/*"
  to = "/blocked.json"
  status = 403
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
