name: V3 Netlify Build Verification
on:
  push:
    branches:
      - feature/webfactory-v3-business-platform
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx netlify-cli link --id 1fa77856-faad-4f0f-8f7c-2671e772513f
      - run: npx netlify-cli build
