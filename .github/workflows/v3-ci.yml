name: WebFactory V3 CI

on:
  push:
    branches:
      - main
      - feature/webfactory-v3-business-platform
  pull_request:
    branches:
      - main

jobs:
  verify-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [core, commerce, experience]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        if: matrix.suite == 'core'
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser for accessibility smoke
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install WebKit for mobile FAQ QA
        run: npx playwright install --with-deps webkit
      - name: Check sidebar destinations, location drafts and redesign plan access
        if: matrix.suite == 'core'
        run: |
          phase="portal-menu"
          log="/tmp/$phase.log"
          if ! node scripts/browser-portal-menu-destinations-smoke.mjs > "$log" 2>&1; then
            cat "$log"
            node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
            exit 1
          fi
          cat "$log"
      - name: Check portal workspaces, mobile menus and navigation transitions
        if: matrix.suite == 'core'
        run: |
          phase="portal-workspace"
          log="/tmp/$phase.log"
          if ! node scripts/browser-portal-workspace-glass-smoke.mjs > "$log" 2>&1; then
            cat "$log"
            node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
            exit 1
          fi
          cat "$log"
      - name: Check login and MFA text contrast on Chromium and WebKit
        if: matrix.suite == 'core'
        run: |
          for engine in chromium webkit; do
            phase="auth-contrast-$engine"
            log="/tmp/$phase.log"
            if ! QA_ENGINE="$engine" QA_PORT=5306 node scripts/browser-auth-contrast-smoke.mjs > "$log" 2>&1; then
              cat "$log"
              node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
              exit 1
            fi
            cat "$log"
          done
      - name: Save login contrast browser evidence
        if: always() && matrix.suite == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: auth-contrast-browser-evidence
          path: |
            /tmp/webfactory-auth-contrast/
            /tmp/auth-contrast-*.log
          if-no-files-found: ignore
      - name: Check Owner/Employee portal and safe workforce retirement
        if: matrix.suite == 'core'
        env:
          QA_BUILT: 1
          QA_PORT: 5222
        run: node scripts/browser-workforce-smoke.mjs
      - name: Check Owner/Employee portal on touch WebKit
        if: matrix.suite == 'core'
        env:
          QA_BUILT: 1
          QA_ENGINE: webkit
          QA_PORT: 5223
          QA_WIDTHS: 320,375,390,430
        run: node scripts/browser-workforce-smoke.mjs
      - name: Save commercial access browser evidence
        if: always() && matrix.suite == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: commercial-access-browser-evidence
          path: /tmp/webfactory-commercial-access/
          if-no-files-found: ignore
      - name: Check interactive platform training, roles and safe practice
        if: matrix.suite == 'core'
        run: |
          for engine in chromium webkit; do
            phase="training-$engine"
            log="/tmp/$phase.log"
            if ! QA_ENGINE="$engine" QA_PORT=5290 node scripts/browser-training-smoke.mjs > "$log" 2>&1; then
              cat "$log"
              node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
              exit 1
            fi
            cat "$log"
          done
      - name: Save training browser evidence
        if: always() && matrix.suite == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: training-browser-evidence
          path: |
            /tmp/webfactory-training-qa/
            /tmp/training-*.log
          if-no-files-found: ignore
      - name: Check unified workspace hierarchy, disclosures and Builder state
        if: matrix.suite == 'experience'
        run: |
          node scripts/browser-workspace-experience-smoke.mjs
          node scripts/browser-admin-experience-smoke.mjs
      - name: Check Marketplace and preserved Crear landing on Chromium and WebKit
        if: matrix.suite == 'experience'
        env:
          QA_WIDTHS: 390,1440
        run: |
          for engine in chromium webkit; do
            log="/tmp/marketplace-$engine.log"
            if ! QA_ENGINE="$engine" QA_PORT=5340 node scripts/browser-marketplace-smoke.mjs > "$log" 2>&1; then
              node scripts/report-kiosk-ci-error.mjs "$log" "marketplace-$engine"
              exit 1
            fi
            cat "$log"
          done
      - name: Check portal route transitions and template Home controls
        if: matrix.suite == 'experience'
        run: node scripts/browser-route-transitions-smoke.mjs
      - name: Check stable authentication cards, keyboard and mobile hero
        if: matrix.suite == 'experience'
        run: node scripts/browser-auth-stability-smoke.mjs
      - name: Check login locale persistence and single session handoff
        if: matrix.suite == 'experience'
        run: |
          QA_BUILT=1 node scripts/browser-login-lifecycle-smoke.mjs
          QA_BUILT=1 QA_ENGINE=webkit node scripts/browser-login-lifecycle-smoke.mjs
      - name: Check initial login visibility, locale handoff and failure states
        if: matrix.suite == 'experience'
        run: node scripts/browser-auth-usability-smoke.mjs
      - name: Check Home FAQ desktop/mobile, themes and languages
        if: matrix.suite == 'experience'
        run: node scripts/browser-home-faq-smoke.mjs
      - name: Check POS 2.0 responsive checkout and retry protection
        if: matrix.suite == 'commerce'
        env:
          QA_BUILT: 1
        run: |
          phase="pos-${QA_ENGINE:-chromium}"
          log="/tmp/$phase.log"
          if ! node scripts/browser-pos-v2-smoke.mjs > "$log" 2>&1; then
            cat "$log"
            node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
            exit 1
          fi
          cat "$log"
      - name: Check POS 2.0 on touch WebKit
        if: matrix.suite == 'commerce'
        env:
          QA_BUILT: 1
          QA_ENGINE: webkit
          QA_PORT: 5221
          QA_WIDTHS: 320,375,390,430
        run: |
          phase="pos-${QA_ENGINE:-chromium}"
          log="/tmp/$phase.log"
          if ! node scripts/browser-pos-v2-smoke.mjs > "$log" 2>&1; then
            cat "$log"
            node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
            exit 1
          fi
          cat "$log"
      - name: Check business profiles, POS module permissions and settings on Chromium
        if: matrix.suite == 'commerce'
        env:
          QA_PORT: 5244
        run: |
          log="/tmp/capabilities-chromium.log"
          if ! node scripts/browser-pos-capabilities-smoke.mjs > "$log" 2>&1; then
            cat "$log"
            node scripts/report-kiosk-ci-error.mjs "$log" capabilities-chromium
            exit 1
          fi
          cat "$log"
      - name: Check business profiles, POS module permissions and settings on WebKit
        if: matrix.suite == 'commerce'
        env:
          QA_ENGINE: webkit
          QA_PORT: 5245
        run: |
          log="/tmp/capabilities-webkit.log"
          if ! node scripts/browser-pos-capabilities-smoke.mjs > "$log" 2>&1; then
            cat "$log"
            node scripts/report-kiosk-ci-error.mjs "$log" capabilities-webkit
            exit 1
          fi
          cat "$log"
      - name: Check editable public URLs, aliases and mobile accessibility on Chromium
        if: matrix.suite == 'commerce'
        run: node scripts/browser-public-site-link-smoke.mjs
      - name: Check editable public URLs and safe retry on touch WebKit
        if: matrix.suite == 'commerce'
        env:
          QA_ENGINE: webkit
          QA_PORT: 5261
        run: node scripts/browser-public-site-link-smoke.mjs
      - name: Check Customer Display pairing, privacy and two-device sale
        if: matrix.suite == 'commerce'
        env:
          QA_BUILT: 1
          QA_PORT: 5224
        run: node scripts/browser-customer-display-smoke.mjs
      - name: Check Customer Display on touch WebKit
        if: matrix.suite == 'commerce'
        env:
          QA_BUILT: 1
          QA_ENGINE: webkit
          QA_PORT: 5225
          QA_WIDTHS: 320,375,390,430
        run: node scripts/browser-customer-display-smoke.mjs
      - name: Check homepage responsive controls, tour and demos
        if: matrix.suite == 'experience'
        run: node scripts/browser-home-evolution-smoke.mjs
      - name: Check all template renderers and saved storefront data
        if: matrix.suite == 'experience'
        run: node scripts/test-template-layout.mjs
      - name: Check template library and Builder responsive parity
        if: matrix.suite == 'experience'
        run: node scripts/browser-template-workspace-smoke.mjs
      - name: Check shared glass composition and motion
        if: matrix.suite == 'experience'
        run: node scripts/browser-template-glass-smoke.mjs
      - name: Check kiosk pairing, privacy, checkout and mobile layouts on Chromium
        if: matrix.suite == 'commerce'
        run: node scripts/browser-kiosk-smoke.mjs
      - name: Check kiosk pairing, privacy, checkout and mobile layouts on WebKit
        if: matrix.suite == 'commerce'
        env:
          QA_ENGINE: webkit
          QA_PORT: 5227
        run: node scripts/browser-kiosk-smoke.mjs
      - name: Check spatial highlights on Chromium and WebKit
        if: matrix.suite == 'experience'
        run: node scripts/browser-spatial-carousel-smoke.mjs
      - name: Check functions for every template and language
        if: matrix.suite == 'experience'
        run: node scripts/browser-template-functions-smoke.mjs
      - name: Check Builder cart and draft interactions
        if: matrix.suite == 'experience'
        run: node scripts/browser-interactions-smoke.mjs
      - name: Check ChatGPT configuration on mobile and desktop
        if: matrix.suite == 'experience'
        run: node scripts/browser-chatgpt-ui-smoke.mjs
      - name: Check installed Shadcn components on desktop and mobile
        if: matrix.suite == 'experience'
        run: node scripts/browser-shadcn-smoke.mjs
      - name: Check floating portal login cards and return controls
        if: matrix.suite == 'experience'
        run: node scripts/browser-portal-glass-smoke.mjs
      - name: Check receipt presentation and cart flight without changing commerce
        if: matrix.suite == 'commerce'
        run: node scripts/browser-reference-styles-smoke.mjs
      - name: Check automatic buyer receipts, demo isolation, PDF and printing
        if: matrix.suite == 'commerce'
        run: node scripts/browser-buyer-receipt-smoke.mjs
      - name: Check portal login fields on desktop and mobile
        if: matrix.suite == 'experience'
        run: node scripts/browser-login-layout-smoke.mjs
      - name: Check panel keyboard navigation
        if: matrix.suite == 'experience'
        run: node scripts/browser-accessibility-smoke.mjs
      - name: Check email previews on mobile and desktop
        if: matrix.suite == 'experience'
        run: node scripts/browser-email-smoke.mjs
      - name: Save portal navigation failure evidence
        if: failure() && matrix.suite == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: portal-navigation-failure-evidence
          path: |
            /tmp/portal-workspace.log
            /tmp/portal-menu.log
            /tmp/webfactory-portal-workspace-failure.png
          if-no-files-found: ignore

  # Preserve the existing required check name while all suites finish independently.
  verify:
    needs: verify-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification suite to pass
        env:
          SUITE_RESULT: ${{ needs.verify-suite.result }}
        run: test "$SUITE_RESULT" = success

  kiosk-bookings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check appointment creation, arrival, balance and privacy
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: node scripts/browser-kiosk-bookings-smoke.mjs

  deploy-preview-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for matching Netlify Deploy Preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=""
          for attempt in {1..36}; do
            state="$(curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status"               | jq -r '[.statuses[] | select(.context=="netlify/webfactorypr/deploy-preview")][0].state // ""')"
            echo "Netlify preview status: ${state:-not-reported} (attempt $attempt/36)"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Netlify Deploy Preview."
          exit 1

      - name: Smoke public V3 routes and readiness
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: |
          for path in / /crear /templates /builder /client-admin /kiosk; do
            echo "Checking $PREVIEW_URL$path"
            curl -fLsS --retry 4 --retry-delay 2 --max-time 30 -o /dev/null "$PREVIEW_URL$path"
          done

          payload="$(curl -fLsS --retry 4 --retry-delay 2 --max-time 30 "$PREVIEW_URL/.netlify/functions/v3-release-readiness")"
          echo "$payload" | jq
          echo "$payload" | jq -e '
            .ok == true and
            (.readyForV3Web | type == "boolean") and
            .subscription.enabled == true and
            .subscription.monthlyPriceConfigured == true and
            .subscription.annualPriceConfigured == true and
            .commerce.deployContext == "deploy-preview" and
            (
              (.commerce.stripeKeyMode == "missing" and .commerce.stripeApi == false and .commerce.stripeWriteSafe == false) or
              (.commerce.stripeKeyMode == "test" and .commerce.stripeApi == true and .commerce.stripeWriteSafe == true)
            ) and
            .integrations.googleCalendar == true and
            .nativeIos.deferred == true and
            .nativeIos.releaseBlocker == false
          '

      - name: Check published booking email previews include code and private PIN
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: node scripts/email-preview-http-smoke.mjs

      - name: Prepare remote kiosk browser verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verification dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Build deployed-preview verification bundle
        run: |
          npm run build > /tmp/unified-preview-build.log 2>&1 || {
            node scripts/report-kiosk-ci-error.mjs /tmp/unified-preview-build.log build
            exit 1
          }
      - name: Check actual Marketplace and Crear routes on the Deploy Preview
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
        run: |
          for engine in chromium webkit; do
            log="/tmp/marketplace-preview-$engine.log"
            if ! QA_ENGINE="$engine" node scripts/browser-marketplace-smoke.mjs > "$log" 2>&1; then
              node scripts/report-kiosk-ci-error.mjs "$log" "marketplace-preview-$engine"
              exit 1
            fi
            cat "$log"
          done
      - name: Check deployed commercial authentication boundaries
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: node scripts/commercial-access-http-smoke.mjs
      - name: Check deployed Owner Employee portal with isolated fixtures
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
        run: |
          QA_PORT=5322 node scripts/browser-commercial-access-smoke.mjs
          QA_ENGINE=webkit QA_PORT=5323 node scripts/browser-commercial-access-smoke.mjs
      - name: Check existing isolated phone review without real business data
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: |
          QA_PORT=5333 node scripts/browser-commercial-review-smoke.mjs
          QA_ENGINE=webkit QA_PORT=5334 node scripts/browser-commercial-review-smoke.mjs
      - name: Check deployed login and MFA text contrast with isolated sessions
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
        run: |
          for engine in chromium webkit; do
            phase="auth-contrast-$engine"
            log="/tmp/$phase.log"
            if ! QA_ENGINE="$engine" QA_PORT=5306 node scripts/browser-auth-contrast-smoke.mjs > "$log" 2>&1; then
              cat "$log"
              node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
              exit 1
            fi
            cat "$log"
          done
      - name: Save login contrast browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-contrast-preview-evidence
          path: |
            /tmp/webfactory-auth-contrast/
            /tmp/auth-contrast-*.log
          if-no-files-found: ignore
      - name: Check deployed unified workspaces with isolated fixtures
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
        run: |
          for engine in chromium webkit; do
            for workspace in workspace admin; do
              phase="$workspace-$engine"
              log="/tmp/unified-preview-$phase.log"
              if ! QA_ENGINE="$engine" node "scripts/browser-$workspace-experience-smoke.mjs" > "$log" 2>&1; then
                cat "$log"
                node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
                exit 1
              fi
              cat "$log"
            done
          done
      - name: Check deployed training with isolated practice on Chromium and WebKit
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
          QA_TRAINING_DETAILS: 0
        run: |
          for engine in chromium webkit; do
            phase="training-$engine"
            log="/tmp/$phase.log"
            if ! QA_ENGINE="$engine" QA_PORT=5290 node scripts/browser-training-smoke.mjs > "$log" 2>&1; then
              cat "$log"
              node scripts/report-kiosk-ci-error.mjs "$log" "$phase"
              exit 1
            fi
            cat "$log"
          done
      - name: Save deployed training browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-preview-evidence
          path: |
            /tmp/webfactory-training-qa/
            /tmp/training-*.log
          if-no-files-found: ignore
      - name: Check deployed appointment kiosk on Chromium
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: node scripts/browser-kiosk-bookings-smoke.mjs
      - name: Check deployed kiosk authentication and privacy boundaries
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: node scripts/kiosk-http-smoke.mjs
      - name: Check actual Deploy Preview kiosk on Chromium and WebKit with isolated fixtures
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: |
          QA_PORT=5236 node scripts/browser-kiosk-smoke.mjs > /tmp/kiosk-preview-chromium.log 2>&1 &
          kiosk_chromium_pid=$!
          QA_ENGINE=webkit QA_PORT=5237 node scripts/browser-kiosk-smoke.mjs > /tmp/kiosk-preview-webkit.log 2>&1 &
          kiosk_webkit_pid=$!
          kiosk_chromium_result=0
          wait "$kiosk_chromium_pid" || kiosk_chromium_result=$?
          kiosk_webkit_result=0
          wait "$kiosk_webkit_pid" || kiosk_webkit_result=$?
          cat /tmp/kiosk-preview-chromium.log /tmp/kiosk-preview-webkit.log
          if [ "$kiosk_chromium_result" -ne 0 ]; then
            node scripts/report-kiosk-ci-error.mjs /tmp/kiosk-preview-chromium.log chromium
          fi
          if [ "$kiosk_webkit_result" -ne 0 ]; then
            node scripts/report-kiosk-ci-error.mjs /tmp/kiosk-preview-webkit.log webkit
          fi
          test "$kiosk_chromium_result" -eq 0
          test "$kiosk_webkit_result" -eq 0
      - name: Check deployed POS profiles and module controls with isolated fixtures
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
        run: |
          QA_PORT=5244 node scripts/browser-pos-capabilities-smoke.mjs > /tmp/pos-capabilities-preview-chromium.log 2>&1 &
          capabilities_chromium_pid=$!
          QA_ENGINE=webkit QA_PORT=5245 node scripts/browser-pos-capabilities-smoke.mjs > /tmp/pos-capabilities-preview-webkit.log 2>&1 &
          capabilities_webkit_pid=$!
          capabilities_chromium_result=0
          wait "$capabilities_chromium_pid" || capabilities_chromium_result=$?
          capabilities_webkit_result=0
          wait "$capabilities_webkit_pid" || capabilities_webkit_result=$?
          cat /tmp/pos-capabilities-preview-chromium.log /tmp/pos-capabilities-preview-webkit.log
          if [ "$capabilities_chromium_result" -ne 0 ]; then
            node scripts/report-kiosk-ci-error.mjs /tmp/pos-capabilities-preview-chromium.log capabilities-chromium
          fi
          if [ "$capabilities_webkit_result" -ne 0 ]; then
            node scripts/report-kiosk-ci-error.mjs /tmp/pos-capabilities-preview-webkit.log capabilities-webkit
          fi
          test "$capabilities_chromium_result" -eq 0
          test "$capabilities_webkit_result" -eq 0
      - name: Check ChatGPT routes and authentication boundaries
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: node scripts/chatgpt-http-smoke.mjs
      - name: Check deployed public URL authorization boundaries
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: node scripts/public-site-link-http-smoke.mjs
      - name: Check deployed public URL editor on Chromium and WebKit with isolated fixtures
        env:
          QA_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
          QA_WIDTHS: 390,1440
        run: |
          QA_PORT=5260 node scripts/browser-public-site-link-smoke.mjs > /tmp/public-link-preview-chromium.log 2>&1 &
          link_chromium_pid=$!
          QA_ENGINE=webkit QA_PORT=5261 node scripts/browser-public-site-link-smoke.mjs > /tmp/public-link-preview-webkit.log 2>&1 &
          link_webkit_pid=$!
          link_chromium_result=0
          wait "$link_chromium_pid" || link_chromium_result=$?
          link_webkit_result=0
          wait "$link_webkit_pid" || link_webkit_result=$?
          cat /tmp/public-link-preview-chromium.log /tmp/public-link-preview-webkit.log
          if [ "$link_chromium_result" -ne 0 ]; then
            node scripts/report-kiosk-ci-error.mjs /tmp/public-link-preview-chromium.log public-link-chromium
          fi
          if [ "$link_webkit_result" -ne 0 ]; then
            node scripts/report-kiosk-ci-error.mjs /tmp/public-link-preview-webkit.log public-link-webkit
          fi
          test "$link_chromium_result" -eq 0
          test "$link_webkit_result" -eq 0
