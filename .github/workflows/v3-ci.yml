name: WebFactory V3 CI

on:
  push:
    branches:
      - main
      - feature/webfactory-v3-business-platform
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy-preview-smoke:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
    steps:
      - name: Wait for Netlify Deploy Preview HTTPS
        run: |
          for attempt in {1..36}; do
            code="$(curl -LsS --max-time 20 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/" || true)"
            echo "Netlify preview HTTP: ${code:-unreachable} (attempt $attempt/36)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Netlify Deploy Preview HTTPS."
          exit 1

      - name: Smoke public V3 routes and readiness
        run: |
          for path in / /templates /builder /client-admin; do
            echo "Checking $PREVIEW_URL$path"
            curl -fLsS --retry 4 --retry-delay 2 --max-time 30 -o /dev/null "$PREVIEW_URL$path"
          done

          payload="$(curl -fLsS --retry 4 --retry-delay 2 --max-time 30 "$PREVIEW_URL/.netlify/functions/v3-release-readiness")"
          echo "$payload" | jq
          echo "$payload" | jq -e '
            .ok == true and
            (.readyForV3Web | type == "boolean") and
            .subscription.enabled == true and
            .subscription.monthlyPriceConfigured == true and
            .subscription.annualPriceConfigured == true and
            .commerce.deployContext == "deploy-preview" and
            (
              (.commerce.stripeKeyMode == "missing" and .commerce.stripeApi == false and .commerce.stripeWriteSafe == false) or
              (.commerce.stripeKeyMode == "test" and .commerce.stripeApi == true and .commerce.stripeWriteSafe == true)
            ) and
            .integrations.googleCalendar == true and
            .nativeIos.deferred == true and
            .nativeIos.releaseBlocker == false
          '
