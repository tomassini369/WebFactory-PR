name: WebFactory V3 CI

on:
  push:
    branches:
      - main
      - feature/webfactory-v3-business-platform
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy-preview-smoke:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Wait for matching Netlify Deploy Preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=""
          for attempt in {1..36}; do
            state="$(curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status"               | jq -r '[.statuses[] | select(.context=="netlify/webfactorypr/deploy-preview")][0].state // ""')"
            echo "Netlify preview status: ${state:-not-reported} (attempt $attempt/36)"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Netlify Deploy Preview."
          exit 1

      - name: Smoke public V3 routes and readiness
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--webfactorypr.netlify.app
        run: |
          for path in / /templates /builder /client-admin; do
            echo "Checking $PREVIEW_URL$path"
            curl -fLsS --retry 4 --retry-delay 2 --max-time 30 -o /dev/null "$PREVIEW_URL$path"
          done

          payload="$(curl -fLsS --retry 4 --retry-delay 2 --max-time 30 "$PREVIEW_URL/.netlify/functions/client-runtime-readiness")"
          echo "$payload" | jq
          echo "$payload" | jq -e '
            .ok == true and
            (.clientPaymentsReady | type == "boolean") and
            (.googleCalendarReady | type == "boolean") and
            (.checks.stripeApi | type == "boolean") and
            (.checks.connectedAccountWebhook | type == "boolean") and
            (.checks.transactionalEmail | type == "boolean") and
            (.checks.googleOAuth | type == "boolean") and
            (.checks.tokenEncryption | type == "boolean")
          '
