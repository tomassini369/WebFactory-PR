name: Anti-slop design audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'DESIGN.md'
      - 'docs/design/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - '.github/workflows/design-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impeccable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Impeccable deterministic audit (advisory baseline)
        shell: bash
        run: |
          set +e
          npx --yes impeccable@4.1.0 detect --json src/ > impeccable-report.json 2> impeccable-stderr.txt
          status=$?
          set -e
          echo "Impeccable detector exit code: $status"
          if [ -s impeccable-stderr.txt ]; then
            cat impeccable-stderr.txt
          fi
          if [ "$status" = "2" ]; then
            echo "Design findings present; review the JSON artifact before changes." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = "0" ]; then
            echo "No primary deterministic design findings reported." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Impeccable detector failed (exit $status)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload design audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-design-audit
          path: |
            impeccable-report.json
            impeccable-stderr.txt
          if-no-files-found: warn
